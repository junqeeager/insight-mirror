# 个人认知画像系统配置

# 系统配置
system:
  data_dir: ./data
  plugins_dir: ./plugins
  log_level: INFO
  timezone: Asia/Shanghai

# 应用配置
app:
  # OAuth 回调等外部服务使用的公网地址（开发可改为 http://localhost:5173）
  public_url: https://t.506ikun.space

# 数据库配置
database:
  # 默认 SQLite；切换 PostgreSQL 时改为 postgresql+psycopg://user:pass@host:5432/dbname
  url: sqlite:///./data/profile.db

# 安全配置
security:
  # 允许跨域访问的来源（生产保持空列表 = 仅同源；开发可加 http://localhost:5173）
  allowed_origins: []
  # 登录限流：窗口内最多失败次数
  login_max_attempts: 5
  login_window_seconds: 900
  # 生产环境缺少 APP_SECRET_KEY 时拒绝启动（dev 默认 false）
  require_secret_key: true

# 数据源配置
sources:
  bilibili:
    enabled: true
    plugin: bilibili
    config:
      cookie: "${BILIBILI_COOKIE}"
      csrf: "${BILIBILI_CSRF}"
    sync:
      interval: hourly
      max_per_sync: 200

  browser_history:
    enabled: false
    plugin: browser_history
    config:
      browser: chrome
      history_path: auto
    sync:
      interval: hourly
      max_per_sync: 500

  github:
    enabled: false
    plugin: github
    config:
      token: "${GITHUB_TOKEN}"
      username: "${GITHUB_USERNAME}"
      include_repos: []
    sync:
      interval: daily
      max_per_sync: 100

  rss:
    enabled: false
    plugin: rss
    config:
      # 示例：
      # feeds:
      #   - url: "https://example.com/rss.xml"
      #     category: "科技"
      feeds: []
    sync:
      interval: daily

  youtube:
    enabled: false
    plugin: youtube
    config:
      client_id: "${YOUTUBE_CLIENT_ID}"
      client_secret: "${YOUTUBE_CLIENT_SECRET}"
      takeout_max_mb: 20
      takeout_max_archive_mb: 200
      takeout_max_total_mb: 1024
    sync:
      interval: daily
      max_per_sync: 100

# 画像分析配置
analysis:
  keyword:
    top_n: 20
    min_frequency: 3
  clustering:
    algorithm: kmeans
    n_clusters: 5
    min_cluster_size: 10
  trends:
    window_size: 7
    significance_threshold: 0.1
  llm:
    # 可选：用 LLM 生成洞察/报告摘要；默认关闭，无 key 时保持本地分析
    enabled: false
    api_base: "https://api.openai.com/v1"
    model: "gpt-4o-mini"
    api_key: "${OPENAI_API_KEY}"

# 报告配置
report:
  output_dir: ./data/reports
  format: html
  templates_dir: ./report/templates

# 可视化配置
visualization:
  theme: dark
  color_palette: default
  max_nodes_graph: 50
