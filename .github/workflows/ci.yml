name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: profile
          POSTGRES_PASSWORD: profile
          POSTGRES_DB: profile
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U profile"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql+psycopg://profile:profile@localhost:5432/profile
      APP_SECRET_KEY: ci-test-secret-key
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - name: Install Python dependencies
        run: pip install -r requirements.txt
      - name: Run backend tests
        run: make test
      - name: Run API tests
        run: python tests/test_api.py
      - name: Scan for secrets
        run: python scripts/check_secrets.py .

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install web dependencies
        run: npm --prefix web ci
      - name: Build SPA
        run: npm --prefix web run build
      - name: Run web tests
        run: npm --prefix web run test
